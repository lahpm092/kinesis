# =============================================================================
# Soccer Prescription Mapping — metric -> threshold -> flag -> prescription
# =============================================================================
# THE audit surface. Everything pipeline/80_prescribe.py emits is derived from
# this file plus the upstream taxonomy. There is no prescription logic hidden in
# the Python: the Python resolves ids, evaluates thresholds, and assembles.
#
# RESOLUTION CONTRACT (enforced by taxonomy_ext/validate_ext.py, exit != 0):
#   every exercise id      -> catalog_seed_part1/2.yaml OR soccer_catalog.yaml
#   every variation id     -> a `variations[].id` of ITS OWN base exercise
#   every method id        -> taxonomy_v2.yaml / taxonomy_v2_methods_part2.yaml
#   every variant id       -> a variant of THAT method
#   every complex family   -> single_load_chain | independent_load_chain | circuit
#   every zone             -> Z1..Z6          every fv_modifier -> FV1..FV6
#   every parallel_type    -> ballistic | plyometric | olympic | dynamic_effort
#   every energy_system    -> alactic | lactic | aerobic_power | mixed
#   every flag id          -> flag_catalog.yaml OR soccer_flags.yaml
#   every intent_declared  -> allowed by rules/prescriptor_rules.yaml::intent_affinity
#   every muscle / pattern / implement -> the closed Layer B enums
#
# BLOCK INVARIANTS (taxonomy_v2.yaml::exercise_block.invariants), re-checked:
#   main         => zone required, parallel_type null
#   parallel     => parallel_type required, zone null
#   conditioning => zone null, parallel_type null, method == complex,
#                   family == circuit, energy_system_tag required
# =============================================================================

version: "1.0"
generator: "pipeline/80_prescribe.py"
upstream:
  root: "/Users/lahpmx/Downloads/taxonomy-v2"
  files:
    - methods/taxonomy_v2.yaml
    - methods/taxonomy_v2_methods_part2.yaml
    - catalog/catalog_schema.yaml
    - catalog/catalog_seed_part1.yaml
    - catalog/catalog_seed_part2.yaml
    - flag_catalog.yaml
    - rules/prescriptor_rules.yaml
    - periodization/periodization_models.yaml
    - periodization/periodization_schema.yaml
    - autoregulation/autoregulation_schema.yaml
    - athlete/athlete_profile_schema.yaml
extension:
  - taxonomy_ext/soccer_catalog.yaml
  - taxonomy_ext/soccer_flags.yaml
  - taxonomy_ext/profile_ext.yaml

# =============================================================================
# SECTION 0 — PROFILE DERIVATION (how metrics.json becomes an athlete_profile)
# =============================================================================

profile_derivation:

  discipline: soccer                # profile_ext widened value
  level: advanced                   # DECLARED, not measured: senior professional squad
  level_note: "level is not derivable from video. It is declared for the whole
               squad and drives deload_overdue_threshold (advanced = 4 weeks)."

  availability:
    days_per_week: 5
    session_minutes: 75
    equipment: [barbell, dumbbell, kettlebell, bodyweight, machine, cable,
                band, sled, box, pull_up_bar, medicine_ball, wall_ball]
    note: "WHITELIST semantics, exactly as generator.js V3.2: any exercise whose
           implement is outside this list is blocked from selection."

  injuries:
    value: []
    derivation: >
      EMPTY BY CONSTRUCTION. metrics.json carries no injury history and no
      medical record, and computer vision cannot observe one. The upstream
      `injuries` field blocks whole movement patterns from selection; populating
      it from a screening signal would remove the exact remedial work the signal
      asks for (a hamstring flag would block `hinge`, deleting the RDL). Risk is
      expressed through profile_ext `risk_gates` instead, which caps specific
      nodes. The mechanism is implemented and honoured in 80_prescribe.py; the
      list is empty because there is no honest input for it.

  body_mass_kg:
    basis: positional_reference_means
    measured: false
    by_position: { GK: 85, CB: 84, FB: 75, DM: 78, CM: 75, AM: 73, W: 73, ST: 79 }
    default: 77
    derivation: "ASSUMED from published positional anthropometric means for
                 senior professional squads. Monocular broadcast video cannot
                 measure mass. Used only to turn %1RM into kg."

  strength:
    estimator: "profile_ext.yaml::e1rm_estimator"
    hub: back_squat                 # catalog strength_hubs.global_hub
    relative_squat: "1.30 + 0.80 * (scores.explosiveness / 100)"
    composed_from_real_inter_hub_ratios:
      deadlift_conventional: { ref: back_squat, ratio: 1.20, confidence: high }
      bench_press_barbell:   { ref: back_squat, ratio: 0.75, confidence: medium }
      power_clean:           { ref: back_squat, ratio: 0.68, confidence: medium }
    bar_increment_kg: 2.5
    derivation: "INFERRED FROM VIDEO. Not a tested 1RM. Every load is emitted as
                 %1RM first and kg second so the plan survives a wrong kg."
    signal_confidence: low          # forced; upstream calibration enum value
    scheduled_correction: "week 9 test week materialises AMRAP blocks on the hub
                           lifts; executed AMRAPs replace the inference with a
                           measurement (periodization_schema::week_entry.test_week)."

  weak_stations:
    semantics: "Upstream V3.2: a token matching an exercise's movement_pattern or
                body_segment DOUBLES that exercise in the selection urn."
    vocabulary: "movement_pattern_enum | body_segment values only"
    source: "union of `profile_effects.weak_stations` over all fired rules"

  quality_gate:
    min_tracking_quality: 0.55
    effect: "below this, the profile is still emitted but no flag may reach
             hard_fail and every projection confidence is forced to low."

# =============================================================================
# SECTION 1 — DERIVED METRICS (what the thresholds are actually evaluated on)
# =============================================================================
# Keys that exist directly in metrics.json measured{} are passed through.
# Anything computed is declared here with its formula, so a reader never has to
# guess what a threshold is comparing against.

derived_metrics:
  accelLoadPerMin:
    formula: "measured.accelLoad / minutes"
    unit: "au/min"
    higher_is_better: true
    note: "vision PlayerLoad is device/formula specific -> cohort z only."
  hsrPerMin:
    formula: "measured.hsr_m / minutes"
    unit: "m/min"
    higher_is_better: true
  sprintsPerMin:
    formula: "measured.sprints / minutes"
    unit: "1/min"
    higher_is_better: true

metric_aliases:
  hipExtROM: [hipROM]
  note: >
    pipeline/60_metrics.py emits the peak-hip-extension construct under the key
    `hipROM`, declared in its own metricDefs as "Hip-extension range" from
    `hipRange`. It is the same quantity this table calls hipExtROM. The alias is
    declared here rather than assumed, and it is one-way: hipExtROM may be read
    from hipROM, never the reverse.

# -----------------------------------------------------------------------------
# DEGENERATE-INPUT GUARD
# -----------------------------------------------------------------------------
# pipeline/60_metrics.py audits its own output and can declare `degenerate: true`
# with a `guard.clamps` table naming metrics that hit a tracking guard rather
# than a physiological limit (e.g. 15/23 tracks pinned to MAX_PLAUSIBLE_SPEED).
# A clamped value is an artifact of the homography, not a measurement.

degenerate_guard:
  honour: true
  rule: >
    For each metric named in guard.clamps, any player whose value equals the
    clamp limit has that metric treated as MISSING — removed before cohort
    statistics and before threshold evaluation. This is the Layer C golden rule
    extended one step: a clamped signal is not a signal, and a deficit derived
    from a clamp would be a claim about the camera, not the athlete.
  consequences:
    - "the rule that reads that metric does not fire for that player"
    - "the metric is excluded from the cohort mean and sd for everyone"
    - "the suppression is recorded in profile.team_context.suppressed_metrics"
    - "when metrics.json declares degenerate:true, EVERY projection confidence
       is forced to low and regimes.json carries the guard reasons verbatim"

cohort_z:
  formula: "(x - mean(cohort)) / stdev(cohort)"
  cohort: "players in this metrics.json with quality >= 0.55"
  sign: "z is computed so that NEGATIVE always means worse, for every metric"
  min_cohort_n: 6
  fallback: "cohort_z rules do not fire below min_cohort_n (Layer C golden rule:
             missing signal = rule does not fire)"

