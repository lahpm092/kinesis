    baseline_reason: "Unilateral reactive contact is the other soccer
                      non-negotiable; it is also the only `jump` exposure a
                      completely unflagged athlete would otherwise receive."
    category: parallel
    method: straight
    variant: default
    family: null
    zone: null
    parallel_type: plyometric
    energy_system_tag: null
    fv_modifier: FV4
    intent_declared: power
    params: { sets: 3, rest_inter_set_sec: 120 }
    work_units:
      - { exercise: hop_single_leg, variation: lateral, reps: 6,
          side: unilateral_alt, load_metric: bodyweight,
          intent: max_reactive_speed }

  blk_rsi_calf:
    slot: lower_strength_2
    priority: 76
    category: main
    method: straight
    variant: default
    family: null
    zone: Z4
    zone_basis: reps_only
    parallel_type: null
    energy_system_tag: null
    fv_modifier: FV5
    intent_declared: hypertrophy
    params: { sets: 3, rest_inter_set_sec: 120 }
    work_units:
      - { exercise: calf_raise_machine, variation: pause_stretch, reps: 10,
          load_metric: absolute_load, rir_target: 1, intent: controlled }

  blk_baseline_squat:
    slot: lower_strength_2
    priority: 20
    baseline: true
    category: main
    method: straight
    variant: default
    family: null
    zone: Z2
    zone_basis: reps_and_load
    parallel_type: null
    energy_system_tag: null
    fv_modifier: FV1
    intent_declared: max_strength
    params: { sets: 4, rest_inter_set_sec: 240 }
    work_units:
      - { exercise: back_squat, variation: null, reps: 4, load_metric: percent_1rm,
          load_pct_1rm: 85, rir_target: 2, intent: max }

  # --- week 9 test block (replaces the inferred e1RM with a measurement) -----

  blk_test_amrap_squat:
    slot: lower_strength_2
    priority: 99
    test_week_only: true
    category: main
    method: amrap
    variant: to_failure
    family: null
    zone: Z3
    zone_basis: reps_and_load
    parallel_type: null
    energy_system_tag: null
    fv_modifier: FV5
    intent_declared: strength            # intent_affinity.amrap contains strength
    params: { sets: 1, rest_inter_set_sec: 300 }
    work_units:
      - { exercise: back_squat, variation: null, reps: 6, load_metric: percent_1rm,
          load_pct_1rm: 80, rir_target: 0, intent: max }
    rationale: "periodization_schema::week_entry.test_week — executed AMRAPs feed
                e1RM calibration (C.4). This is where the video-inferred e1RM is
                replaced by a measured one."

# =============================================================================
# SECTION 3 — RULES: metric -> threshold -> flag -> prescription
# =============================================================================

rules:

  - id: r_acceleration_deficit
    metric: accelLoadPerMin
    reads: "Acceleration output density below the tracked cohort"
    threshold_basis: cohort_z
    thresholds:
      warning_mild:   { z_lte: -0.8 }
      warning_strong: { z_lte: -1.3 }
    emits: acceleration_deficit
    targets: [accelLoad, topSpeed]
    profile_effects: { weak_stations: [locomotion, hinge] }
    prescribes: [blk_accel_contrast, blk_accel_circuit]
    projection:
      - { metric: topSpeed,  mode: pct, warning_mild: 0.8, warning_strong: 1.2,
          confidence: low,
          basis: "Combined heavy resistance + short-sprint exposure improves
                  sprint performance by roughly 1-3% over 8-12 weeks in trained
                  team-sport athletes (plyometric/sprint training meta-analyses,
                  e.g. Saez de Villarreal, Requena & Cronin 2012, JSCR 26(2)).
                  We take the LOW end, and only when both the heavy contrast and
                  the acceleration circuit are actually prescribed." }
      - { metric: accelLoad, mode: pct, warning_mild: 1.5, warning_strong: 2.5,
          confidence: low,
          basis: "Vision PlayerLoad is arbitrary units (Boyd, Ball & Aughey 2011,
                  IJSPP 6(3)); only the within-system trend is meaningful. Small
                  positive delta declared, explicitly low confidence." }

  - id: r_max_velocity_deficit
    metric: topSpeed
    reads: "Observed peak speed below the elite outfield reference band"
    threshold_basis: literature_absolute
    threshold_source: "Elite outfield peak match speed 8.6-9.4 m/s; fastest
                       9.7-10.3 m/s (docs/metrics_spec.md A4, sourced)."
    thresholds:
      warning_mild:   { lte: 8.4 }
      warning_strong: { lte: 7.9 }
    caveat: "Observed peak within a short tracked window underestimates true
             vmax. The flag reads as 'not shown', never as 'cannot'."
    emits: max_velocity_deficit
    targets: [topSpeed]
    profile_effects: { weak_stations: [locomotion, hinge] }
    prescribes: [blk_maxv_flying, blk_maxv_olympic]
    projection:
      - { metric: topSpeed, mode: pct, warning_mild: 1.0, warning_strong: 1.6,
          ceiling_metric_value: 8.8, ceiling_scale: 0.5, confidence: low,
          basis: "Maximal-velocity exposure plus olympic-pull RFD work. Same
                  1-3% literature band as r_acceleration_deficit, low end taken.
                  Halved above 8.8 m/s: the closer to the ceiling, the smaller
                  the return." }

  - id: r_deceleration_capacity_deficit
    metric: kneeROM
    reads: "Braking knee range short: stiff-legged deceleration"
    threshold_basis: literature_absolute
    threshold_source: "Deceleration with the knee closer to extension is the
                       high-load, high-risk braking pattern (Harper, Carling &
                       Kiely 2019, Sports Med 49; Hewett et al. 2005, AJSM 33(4))."
    thresholds:
      warning_mild:   { lte: 112 }
      warning_strong: { lte: 104 }
    emits: deceleration_capacity_deficit
    targets: [kneeROM, codPeak]
    profile_effects: { weak_stations: [lunge, knee_flexion] }
    prescribes: [blk_decel_rdl, blk_decel_landing, blk_cod_circuit]
    projection:
      - { metric: kneeROM, mode: abs, warning_mild: 2.5, warning_strong: 4.0,
          unit: deg, confidence: low,
          basis: "Eccentric hinge + landing work changes braking strategy before
                  it changes anatomy; a few degrees of extra knee flexion over 9
                  weeks is the conservative claim. Not a ROM measurement." }

  - id: r_rsa_decrement_high
    metric: hsrPerMin
    reads: "High-speed output density low: repeated-sprint output does not hold"
    threshold_basis: cohort_z
    thresholds:
      warning_mild:   { z_lte: -0.8 }
      warning_strong: { z_lte: -1.3 }
    caveat: "PROXY. A true RSA decrement needs a within-match time series of
             sprint speeds; metrics.json carries totals. Declared as density."
    emits: rsa_decrement_high
    targets: [hsr_m]
    profile_effects: { weak_stations: [locomotion] }
    prescribes: [blk_rsa_circuit, blk_rsa_mixed]
    projection:
      - { metric: hsr_m, mode: pct, warning_mild: 3.0, warning_strong: 4.5,
          confidence: low,
          basis: "Repeated-sprint training improves repeated-sprint output; the
                  match-total metric it is projected onto is also driven by
                  tactical context, so the delta is deliberately small." }

  - id: r_reactive_strength_low
    metric: anklePush
    reads: "Ankle push-off velocity low: weak fast stretch-shortening output"
    threshold_basis: cohort_z
    threshold_source: "Ankle plantarflexion velocity at toe-off as an RSI proxy
                       (Flanagan & Comyns 2008, Strength Cond J 30(5))."
    thresholds:
      warning_mild:   { z_lte: -0.8 }
      warning_strong: { z_lte: -1.3 }
    emits: reactive_strength_low
    targets: [anklePush, topSpeed]
    profile_effects: { weak_stations: [jump, calf_raise] }
    prescribes: [blk_rsi_plyo, blk_rsi_french, blk_rsi_calf]
    projection:
      - { metric: anklePush, mode: pct, warning_mild: 2.0, warning_strong: 3.5,
          confidence: low,
          basis: "Short-contact plyometrics improve reactive strength index;
                  the ankle-velocity proxy is expected to move less than the
                  underlying RSI, so the projection is smaller than the
                  literature effect on RSI itself." }

  - id: r_cod_reorientation_slow
    metric: codPeak
    cofactor: reactionMs
    reads: "Peak reorientation rate low"
    threshold_basis: literature_absolute
    threshold_source: "COD sharpness / COD deficit framing (Sheppard & Young
                       2006, J Sports Sci 24(9); Nimphius et al. 2016)."
    thresholds:
      warning_mild:   { lte: 130 }
      warning_strong: { lte: 115 }
    emits: cod_reorientation_slow
    targets: [codPeak]
    profile_effects: { weak_stations: [locomotion, lunge] }
    prescribes: [blk_cod_circuit, blk_asym_hop_lateral, blk_asym_split]
    projection:
      - { metric: codPeak, mode: pct, warning_mild: 2.5, warning_strong: 4.0,
          confidence: low,
          basis: "COD-specific drilling plus unilateral strength improves 505
                  performance by a few percent over a block; we project the
                  reorientation-rate proxy, not a 505 time." }

  - id: r_limb_asymmetry_detected
    metric: strideAsym
    reads: "Inter-limb asymmetry above the Bishop band"
    threshold_basis: literature_absolute
    threshold_source: "Bishop et al. (2019), JSCR — jump asymmetries associate
                       with slower sprint and COD; ~5-10% is the practical band,
                       >15% is large. Kinematic index, not force-plate."
    thresholds:
      warning_mild:   { gte: 5.0 }
      warning_strong: { gte: 10.0 }
    emits: limb_asymmetry_detected
    targets: [strideAsym]
    profile_effects: { weak_stations: [lunge, knee_flexion] }
    prescribes: [blk_asym_split, blk_asym_hipthrust, blk_ham_legcurl,
                 blk_asym_hop_lateral]
    projection:
      - { metric: strideAsym, mode: abs, warning_mild: -1.5, warning_strong: -2.5,
          unit: pct_points, floor: 3.0, confidence: medium,
          basis: "Unilateral loading with the weaker side leading is the standard
                  intervention and asymmetry is modifiable within a block. Floored
                  at 3%: below that the CV symmetry index is measuring its own
                  noise, so no projection may claim it." }

  - id: r_ankle_dorsiflexion_restricted
    metric: ankleROM
    reads: "Sagittal ankle excursion restricted through stance"
    threshold_basis: literature_absolute
    thresholds:
      warning_mild:   { lte: 38 }
      warning_strong: { lte: 32 }
    caveat: "PROXY for weight-bearing dorsiflexion, from a sagittal camera view."
    emits: ankle_dorsiflexion_restricted
    targets: [ankleROM]
    profile_effects: { weak_stations: [calf_raise] }
    prescribes: [blk_ankle_accessory]
    projection:
      - { metric: ankleROM, mode: abs, warning_mild: 2.0, warning_strong: 3.5,
          unit: deg, confidence: low,
          basis: "Loaded end-range ankle work produces small ROM gains over
                  weeks. Low confidence: the input is a video proxy and the
                  intervention literature uses goniometry." }

  - id: r_hip_extension_restricted
    metric: hipExtROM
    reads: "Peak hip extension at toe-off restricted"
    threshold_basis: literature_absolute
    thresholds:
      warning_mild:   { lte: 10 }
    emits: hip_extension_restricted
    targets: [hipExtROM]
    profile_effects: { weak_stations: [hinge, lunge] }
    prescribes: [blk_hipext_accessory, blk_asym_split]
    projection:
      - { metric: hipExtROM, mode: abs, warning_mild: 1.5, unit: deg,
          confidence: low,
          basis: "Rear-foot-elevated and half-kneeling positions load the hip in
                  extension; a degree or two at toe-off is the honest claim." }

  - id: r_hamstring_strain_risk_elevated
    metric: composite
    reads: "Screening composite: asymmetry, braking knee range, high-speed density"
    threshold_basis: composite
    composite:
      conditions:
        - { id: c_asym,  expr: "strideAsym >= 8.0",
            reads: "inter-limb asymmetry in the band Bishop associates with
                    slower sprint and COD" }
        - { id: c_knee,  expr: "kneeROM <= 108",
            reads: "stiff-legged braking: the high-eccentric-cost pattern" }
        - { id: c_load,  expr: "hsrPerMin_z >= 0.5",
            reads: "high high-speed exposure — an amplifier, never a cause" }
      necessary: "c_asym OR c_knee"
      necessary_rationale: >
        Exposure alone does not make a flag. A fast winger who covers a lot of
        high-speed ground is doing his job; without an asymmetry or a braking
        deficit there is nothing here to act on, and firing on exposure alone
        would flag every good athlete in the squad.
      warning_mild:   "exactly one of {c_asym, c_knee} AND NOT c_load"
      warning_strong: "(c_asym AND c_knee) OR (one of them AND c_load)"
      hard_fail:      "strideAsym >= 15.0 AND kneeROM <= 104"
    caveat: "SCREENING ONLY. Not a clinical prediction, not a diagnosis, and not
             validated against injury outcomes in this cohort."
    emits: hamstring_strain_risk_elevated
    targets: [strideAsym]
    profile_effects:
      weak_stations: [knee_flexion, hinge]
      risk_gates_at_hard_fail: [max_velocity_exposure_withheld]
    prescribes: [blk_ham_nordic, blk_decel_rdl, blk_ham_legcurl]
    projection: []
    projection_note: >
      NO metric projection. The intervention targets injury risk, and this
      pipeline has no injury outcome to project onto. Claiming a strideAsym
      improvement here would double-count r_limb_asymmetry_detected.

  - id: r_scan_rate_low
    metric: scanRate
    reads: "Visual exploration below the professional band"
    threshold_basis: literature_absolute
    threshold_source: "Jordet et al. (2020), Front Psychol 11:553813 — ~0.3-0.6
                       scans/s for professionals; elite exemplars 0.62-0.83."
    thresholds:
      warning_mild:   { lte: 0.35 }
    emits: scan_rate_low
    targets: []
    profile_effects: {}
    prescribes: []
    out_of_scope: true
    out_of_scope_reason: >
      taxonomy-v2 is a resistance and conditioning taxonomy. It contains no
      perceptual-cognitive node, and inventing one would be inventing a science
      this system does not have. The flag is emitted and surfaced to the coach
      with the honest instruction that scanning is trained by pitch-based
      constraint design. No work units, no projection.
    projection: []

# =============================================================================
# SECTION 4 — MICROCYCLE SKELETON (typed session slots)
# =============================================================================
# Fixed 7-day shape. Flags choose the CONTENT of the slots; they never move the
# slots, because the shape is what keeps the ten interference rules satisfied.

microcycle:
  id: mc_soccer_5d
  name: "Soccer off-season concurrent 5 days"
  days_span: 7
  conditioning_budget: { high_max: 2, moderate_max: 2 }

  frequency_targets:                     # map<movement_pattern, {min,max}> in DAYS
    squat:        { min: 1, max: 3 }
    hinge:        { min: 1, max: 4 }
    lunge:        { min: 1, max: 3 }
    locomotion:   { min: 2, max: 4 }
    jump:         { min: 1, max: 3 }
    knee_flexion: { min: 0, max: 3 }
    push_h:       { min: 1, max: 2 }
    pull_v:       { min: 1, max: 2 }
    anti_rotation: { min: 0, max: 2 }
    calf_raise:   { min: 0, max: 3 }
    hip_adduction: { min: 0, max: 2 }
  frequency_note: >
    hinge tolerates 4 days because only one of them is a heavy bilateral pull:
    the others are a slow-eccentric RDL, a single-leg hip thrust, and a kettlebell
    swing inside a contrast chain. The band counts EXPOSURES, not equivalent doses.

  slots:
    - slot_id: speed_power
      day: 1
      day_label: Mon
      intent: power
      primary_patterns: [squat, locomotion, jump]
      target_zones: [Z2]
      conditioning_load_target: low
      max_blocks: 4
      session_name: "Speed and power"
    - slot_id: lower_strength
      day: 2
      day_label: Tue
      intent: strength
      primary_patterns: [hinge, lunge, knee_flexion]
      target_zones: [Z2, Z3, Z4]
      conditioning_load_target: low
      max_blocks: 5
      session_name: "Lower strength — posterior chain"
    - slot_id: upper_core_prehab
      day: 3
      day_label: Wed
      intent: mixed
      primary_patterns: [push_h, pull_v, anti_rotation, calf_raise, hip_adduction]
      target_zones: [Z3, Z4, Z5]
      conditioning_load_target: moderate
      max_blocks: 5
      session_name: "Upper, trunk and prehab"
    - slot_id: conditioning_rsa
      day: 5
      day_label: Fri
      intent: conditioning
      primary_patterns: [locomotion]
      target_zones: null
      conditioning_load_target: high
      max_blocks: 3
      session_name: "Repeated-sprint and mixed conditioning"
    - slot_id: lower_strength_2
      day: 6
      day_label: Sat
      intent: strength
      primary_patterns: [squat, hinge, jump]
      target_zones: [Z2, Z4]
      conditioning_load_target: low
      max_blocks: 4
      session_name: "Lower strength — squat and unilateral reactive"
  rest_days: [4, 7]

  max_blocks_rationale: >
    max_blocks IS the time budget. availability.session_minutes is 75, and a
    block of 3-5 sets with its prescribed rests runs 12-18 minutes, so 4-5
    blocks fill a session. When more blocks than the cap are requested, the
    lowest-priority ones are DROPPED AND RECORDED in prescription.dropped_blocks
    with the reason — the plan never silently omits work a flag asked for.

  block_order_within_day: [parallel, main, conditioning]
  block_order_rationale: "same_day_order_strength_first is satisfied (no
                          conditioning block precedes a main block); plyometric
                          and olympic parallel work leads because it is the most
                          fatigue-sensitive quality in the session."

  interference_compliance:
    checked_against: "periodization_schema.yaml::interference_rules.seed_catalog
                      (all 10 rules)"
    reasoning:
      quality_locomotion_after_lower_heavy:
        "high conditioning is day 5; the nearest preceding lower-strength slot is
         day 2 (72 h). Day 6 lower strength is followed by two rest-or-power days."
      no_adjacent_lactic_high:
        "exactly one high-conditioning day in the week."
      power_requires_freshness:
        "the power slot is day 1; day 7 is a rest day, so no power slot ever
         follows a high-conditioning day."
      same_pattern_heavy_spacing:
        "the two strength slots (day 2, day 6) are 96 h apart."
      axial_loading_adjacent:
        "INTERPRETATION: the rule is written over SLOTS ('heavy squat and hinge
         slots'), so it is evaluated on slots whose intent is strength or
         hypertrophy. Day 1 is a power slot whose heavy squat is a potentiation
         dose inside a contrast pair; days 2 and 6 are not adjacent. Stated
         explicitly because it is the one rule where the reading matters."
      same_day_order_strength_first: "see block_order_within_day."
      conditioning_budget_exceeded: "1 high + 1 moderate against a 2/2 budget."
      recovery_slot_after_peak_day: "day 7 rest follows the day-5/6 load peak."
      minimum_rest_density: "2 rest days against floor(7/7) = 1."
      technique_requires_freshness: "no technique slot is declared."

# =============================================================================
# SECTION 5 — MESOCYCLE / MACROCYCLE PLAN
# =============================================================================

periodization:
  model: concurrent_hybrid              # periodization_models.yaml
  model_variant: balanced               # concurrent_hybrid.variants.balanced
  model_justification: >
    concurrent_hybrid is the only upstream model tagged team_sport_offseason,
    and interference_rules are MANDATORY for it — which is exactly the problem
    a soccer athlete presents: speed, strength and conditioning in parallel.
  total_weeks: 9
  deload_cadence_weeks: 4
  deload_cadence_check: "concurrent_hybrid.deload_positioning expects every 3-4
                         weeks (the tightest of the five models); level=advanced
                         gives deload_overdue_threshold 4. 4 satisfies both."
  mesocycles:
    - id: ms_soccer_gpp
      name: "General preparation"
      periodization_model: concurrent_hybrid
      model_variant: balanced
      duration_weeks: 4
      weeks:
        - { week: 1, type: intro,
            modifiers: [ { dimension: load_pct, delta: -10, scope: { type: all } } ] }
        - { week: 2, type: standard, modifiers: [] }
        - { week: 3, type: standard,
            modifiers: [ { dimension: load_pct, delta: 2.5,
                           scope: { type: by_intent, value: max_strength } },
                         { dimension: conditioning_volume_pct, delta: 10,
                           scope: { type: by_intent, value: conditioning } } ] }
        - { week: 4, type: planned_deload,
            deload_recipe: { sets_pct: -40, load_pct: 0,
                             conditioning_load_cap: "0.5 x chronic" } }
    - id: ms_soccer_spp
      name: "Specific preparation"
      periodization_model: concurrent_hybrid
      model_variant: balanced
      duration_weeks: 4
      weeks:
        - { week: 5, type: standard, modifiers: [] }
        - { week: 6, type: standard,
            modifiers: [ { dimension: load_pct, delta: 2.5,
                           scope: { type: by_intent, value: max_strength } } ] }
        - { week: 7, type: standard,
            modifiers: [ { dimension: load_pct, delta: 5.0,
                           scope: { type: by_intent, value: max_strength } },
                         { dimension: conditioning_volume_pct, delta: 15,
                           scope: { type: by_intent, value: conditioning } } ] }
        - { week: 8, type: planned_deload,
            deload_recipe: { sets_pct: -40, load_pct: 0,
                             conditioning_load_cap: "0.5 x chronic" } }
    - id: ms_soccer_test
      name: "Test and recalibration"
      periodization_model: concurrent_hybrid
      model_variant: balanced
      duration_weeks: 1
      weeks:
        - { week: 9, type: test,
            note: "AMRAP on the hub lift replaces the video-inferred e1RM with a
                   measured one (C.4 e1RM calibration)." }
  progression_scheme:
    axis: mixed
    ramp:
      - { weeks: [3, 6, 7], dimension: load_pct, per_week: 2.5,
          scope: { type: by_intent, value: max_strength } }
      - { weeks: [3, 7], dimension: conditioning_volume_pct, per_week: 10,
          scope: { type: by_intent, value: conditioning } }
    description: "concurrent_hybrid/balanced: emphasis alternates between
                  microcycles; neither axis is allowed to run away."

# =============================================================================
# SECTION 6 — VOLUME AUDIT CONFIG (Layer C.3, verbatim)
# =============================================================================

volume_audit:
  window_days: 7
  fractional_counting: { primary: 1.0, secondary: 0.5,
                         override: muscle_contribution_override }
  effective_set_threshold: { rir_max: 4, source: "rir_reported ?? rir_target" }
  method_set_counting:                   # autoregulation_schema.yaml::method_set_counting
    straight: "1 per set"
    cluster: "1 per complete cluster set"
    contrast: "1 per pair (explosive adds no hypertrophic volume)"
    complex_ilc: "1 per component per round"
    complex_slc: "1 per round, distributed per component contribution"
    amrap: "1"
    conditioning: "0 -> separate bucket"
  parallel_category_counting:
    value: 0
    justification: "The upstream table has no entry for a standalone plyometric
                    or olympic block. It DOES rule that in a contrast block the
                    explosive component adds no hypertrophic volume. We extend
                    that same ruling to standalone parallel blocks rather than
                    inventing a number: a hop is neurally expensive and
                    hypertrophically cheap."
  landmarks: "autoregulation_schema.yaml::volume_landmarks (population defaults)"
  emits: [muscle_volume_below_mev, muscle_volume_approaching_mrv,
          muscle_volume_exceeded_mrv]
  below_mev_gate:
    rule: goal_groups_only
    goal_groups: "primary_muscles of every exercise in a FLAG-DRIVEN (non-baseline)
                  block — i.e. the muscles this athlete's prescription is actually
                  trying to develop"
    source: >
      periodization_schema.yaml::integration.volume_status_feeds_scaling declares
      the below-MEV consequence as `below_mev_and_goal_includes`. The upstream
      engine itself gates the flag on the goal containing the group, so a soccer
      plan does not emit fourteen 'your rotator cuff is below MEV' flags. The
      full table is still reported in volume_audit.groups; only the FLAG is gated.
    over_mev_flags: "muscle_volume_approaching_mrv and muscle_volume_exceeded_mrv
                     are NOT gated: too much volume matters wherever it happens."

# =============================================================================
# SECTION 7 — PROJECTION CONFIG
# =============================================================================
# Everything here produces numbers labelled `projected: true`. None of it is a
# measurement, and none of it may be rendered in the same register as one.

projection:
  horizon_weeks: 9
  requires: "the rule's blocks must actually survive into the assembled
             microcycle; a block dropped by the slot cap does not project"
  global_confidence_note: >
    Every projection is a conservative point estimate with no interval. The
    literature ranges they are drawn from are group means from other cohorts
    under other conditions. They are a planning aid, not a forecast.

  score_sensitivity:
    basis: declared_heuristic
    confidence: low
    disclosure: >
      These weights are NOT empirical. They are a declared, monotone, deliberately
      shallow map from projected metric deltas to the 0-100 scores, so the pitch
      can show a coherent before/after without inventing a second model. Score
      deltas are capped hard.
    unit: "score points per 1% relative metric improvement, or per unit for `abs` metrics"
    explosiveness:
      topSpeed:  { per_pct: 2.5 }
      anklePush: { per_pct: 0.6 }
      accelLoad: { per_pct: 0.3 }
    durability:
      strideAsym: { per_unit: -1.2 }     # negative delta in % points -> positive score
      ankleROM:   { per_unit: 0.35 }
      kneeROM:    { per_unit: 0.25 }
    reactivity:
      anklePush: { per_pct: 0.5 }
      codPeak:   { per_pct: 0.8 }
    coordination:
      strideAsym: { per_unit: -0.8 }
      kneeROM:    { per_unit: 0.2 }
      hipExtROM:  { per_unit: 0.4 }
    spatialAwareness: {}                 # deliberately empty — see unprojectable
    caps: { per_score: 6, overall: 5 }
    overall_rule: "overall = round(mean(durability, explosiveness, reactivity,
                   coordination, spatialAwareness)) recomputed from the projected
                   sub-scores"

  unprojectable:
    - { metric: scanRate, reason: "no node in taxonomy-v2 trains it; the flag is
        emitted with an out-of-scope suggestion and nothing is claimed" }
    - { metric: spatialAwareness, reason: "driven by scanRate, which is
        unprojectable; the score is carried through unchanged" }
    - { metric: sprints, reason: "a count driven by match context and tactical
        role, not a capacity" }
    - { metric: reactionMs, reason: "at 25 fps one frame is 40 ms; the metric is
        for ranking, not for grading a delta" }
    - { metric: losReactivity, reason: "a relational measure of this match's
        opponents; not an athlete property that a training block moves" }
    - { metric: minutes, reason: "not a performance metric" }
